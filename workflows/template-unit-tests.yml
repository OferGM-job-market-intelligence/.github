# =============================================================================
# Reusable Workflow: Unit Tests
# =============================================================================
# Central template for running unit tests across all services.
# Supports: Bun.js (TypeScript), Python, Go
#
# Usage (from service repo):
#   jobs:
#     unit-tests:
#       uses: OferGM-job-market-intelligence/.github/.github/workflows/template-unit-tests.yml@main
#       with:
#         language: "bunjs"
#
# =============================================================================

name: "Template: Unit Tests"

on:
  workflow_call:
    inputs:
      language:
        description: "Service language runtime: bunjs | python | go"
        required: true
        type: string
      working_directory:
        description: "Working directory relative to repo root"
        required: false
        type: string
        default: "."
      node_version:
        description: "Bun version (for bunjs services)"
        required: false
        type: string
        default: "1.1.38"
      python_version:
        description: "Python version (for python services)"
        required: false
        type: string
        default: "3.11"
      go_version:
        description: "Go version (for go services)"
        required: false
        type: string
        default: "1.21"
      test_command:
        description: "Override the default test command"
        required: false
        type: string
        default: ""
      min_coverage:
        description: "Minimum coverage percentage to pass (0 to disable)"
        required: false
        type: number
        default: 0
    outputs:
      coverage_percentage:
        description: "The code coverage percentage achieved"
        value: ${{ jobs.unit-tests.outputs.coverage }}

jobs:
  unit-tests:
    name: "Unit Tests (${{ inputs.language }})"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage-output.outputs.coverage }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      # -----------------------------------------------------------------------
      # Common: Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Bun.js — bun test
      # -----------------------------------------------------------------------
      - name: Setup Bun
        if: inputs.language == 'bunjs'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.node_version }}

      - name: Install dependencies (Bun)
        if: inputs.language == 'bunjs'
        run: bun install --frozen-lockfile

      - name: Run unit tests (Bun)
        if: inputs.language == 'bunjs'
        run: |
          if [ -n "${{ inputs.test_command }}" ]; then
            ${{ inputs.test_command }}
          else
            bun test --coverage
          fi

      - name: Parse coverage (Bun)
        if: inputs.language == 'bunjs'
        id: bun-coverage
        run: |
          # Bun outputs coverage to stdout; capture the total line
          COVERAGE=$(bun test --coverage 2>&1 | grep -E "^All files" | awk '{print $4}' | tr -d '%' || echo "0")
          echo "coverage=${COVERAGE:-0}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Python — pytest
      # -----------------------------------------------------------------------
      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Python dependencies
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run unit tests (Python)
        if: inputs.language == 'python'
        run: |
          if [ -n "${{ inputs.test_command }}" ]; then
            ${{ inputs.test_command }}
          else
            python -m pytest tests/unit/ \
              --cov=src \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              -v
          fi

      - name: Parse coverage (Python)
        if: inputs.language == 'python'
        id: python-coverage
        run: |
          COVERAGE=$(python -m pytest tests/unit/ --cov=src --cov-report=term 2>&1 | grep "^TOTAL" | awk '{print $NF}' | tr -d '%' || echo "0")
          echo "coverage=${COVERAGE:-0}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Go — go test
      # -----------------------------------------------------------------------
      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      - name: Run unit tests (Go)
        if: inputs.language == 'go'
        run: |
          if [ -n "${{ inputs.test_command }}" ]; then
            ${{ inputs.test_command }}
          else
            go test ./... \
              -v \
              -race \
              -short \
              -coverprofile=coverage.out \
              -covermode=atomic
          fi

      - name: Parse coverage (Go)
        if: inputs.language == 'go'
        id: go-coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%' || echo "0")
          echo "coverage=${COVERAGE:-0}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Common: Coverage output & gate
      # -----------------------------------------------------------------------
      - name: Set coverage output
        id: coverage-output
        run: |
          COV="${{ steps.bun-coverage.outputs.coverage || steps.python-coverage.outputs.coverage || steps.go-coverage.outputs.coverage || '0' }}"
          echo "coverage=${COV}" >> "$GITHUB_OUTPUT"
          echo "📊 Coverage: ${COV}%"

      - name: Coverage gate
        if: inputs.min_coverage > 0
        run: |
          COV="${{ steps.coverage-output.outputs.coverage }}"
          MIN="${{ inputs.min_coverage }}"
          echo "Coverage: ${COV}% | Minimum: ${MIN}%"
          if [ "$(echo "$COV < $MIN" | bc -l)" -eq 1 ]; then
            echo "❌ Coverage ${COV}% is below minimum ${MIN}%"
            exit 1
          fi
          echo "✅ Coverage ${COV}% meets minimum ${MIN}%"