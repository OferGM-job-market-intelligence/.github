# =============================================================================
# Reusable Workflow: Integration Tests
# =============================================================================
# Central template for running integration tests with service dependencies.
# Spins up required infrastructure (Kafka, Redis, MongoDB, Elasticsearch)
# via Docker Compose service containers.
#
# Supports: Bun.js (TypeScript), Python, Go
#
# Usage (from service repo):
#   jobs:
#     integration-tests:
#       uses: OferGM-job-market-intelligence/.github/.github/workflows/template-integration-tests.yml@main
#       with:
#         language: "bunjs"
#         needs_kafka: true
#         needs_redis: true
#
# =============================================================================

name: "Template: Integration Tests"

on:
  workflow_call:
    inputs:
      language:
        description: "Service language runtime: bunjs | python | go"
        required: true
        type: string
      working_directory:
        description: "Working directory relative to repo root"
        required: false
        type: string
        default: "."
      node_version:
        description: "Bun version (for bunjs services)"
        required: false
        type: string
        default: "1.1.38"
      python_version:
        description: "Python version (for python services)"
        required: false
        type: string
        default: "3.11"
      go_version:
        description: "Go version (for go services)"
        required: false
        type: string
        default: "1.21"
      test_command:
        description: "Override the default integration test command"
        required: false
        type: string
        default: ""
      needs_kafka:
        description: "Whether the service needs Kafka for integration tests"
        required: false
        type: boolean
        default: false
      needs_redis:
        description: "Whether the service needs Redis for integration tests"
        required: false
        type: boolean
        default: false
      needs_mongodb:
        description: "Whether the service needs MongoDB for integration tests"
        required: false
        type: boolean
        default: false
      needs_elasticsearch:
        description: "Whether the service needs Elasticsearch for integration tests"
        required: false
        type: boolean
        default: false
    secrets:
      MONGODB_URI:
        description: "MongoDB connection URI (if using external Atlas)"
        required: false

jobs:
  integration-tests:
    name: "Integration Tests (${{ inputs.language }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    # -------------------------------------------------------------------------
    # Service containers — only started if the corresponding input is true.
    # GitHub Actions doesn't support conditional services natively, so we
    # spin them all up and let the test framework connect to what it needs.
    # The lightweight containers have negligible overhead when unused.
    # -------------------------------------------------------------------------
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6380
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: elasticsearch:8.12.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms256m -Xmx256m"
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

    # -------------------------------------------------------------------------
    # Environment variables available to all integration tests
    # -------------------------------------------------------------------------
    env:
      NODE_ENV: test
      REDIS_URL: redis://localhost:6380
      MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://testuser:testpass@localhost:27017' }}
      ELASTICSEARCH_URL: http://localhost:9200
      KAFKA_BROKERS: localhost:9092

    steps:
      # -----------------------------------------------------------------------
      # Common: Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Optional: Start Kafka via Docker Compose (not available as a service container)
      # -----------------------------------------------------------------------
      - name: Start Kafka
        if: inputs.needs_kafka
        run: |
          docker run -d --name zookeeper \
            -e ALLOW_ANONYMOUS_LOGIN=yes \
            -p 2181:2181 \
            bitnami/zookeeper:latest

          docker run -d --name kafka \
            -e KAFKA_CFG_ZOOKEEPER_CONNECT=host.docker.internal:2181 \
            -e KAFKA_CFG_LISTENERS=PLAINTEXT://:9092 \
            -e KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e ALLOW_PLAINTEXT_LISTENER=yes \
            --add-host=host.docker.internal:host-gateway \
            -p 9092:9092 \
            bitnami/kafka:latest

          # Wait for Kafka to be ready
          echo "Waiting for Kafka to be ready..."
          for i in $(seq 1 30); do
            if docker exec kafka kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null; then
              echo "✅ Kafka is ready"
              break
            fi
            echo "Attempt $i/30 — waiting..."
            sleep 2
          done
        working-directory: /

      # -----------------------------------------------------------------------
      # Bun.js — Integration tests
      # -----------------------------------------------------------------------
      - name: Setup Bun
        if: inputs.language == 'bunjs'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.node_version }}

      - name: Install dependencies (Bun)
        if: inputs.language == 'bunjs'
        run: bun install --frozen-lockfile

      - name: Run integration tests (Bun)
        if: inputs.language == 'bunjs'
        run: |
          if [ -n "${{ inputs.test_command }}" ]; then
            ${{ inputs.test_command }}
          else
            bun test --test-name-pattern="integration" --timeout 30000
          fi

      # -----------------------------------------------------------------------
      # Python — Integration tests
      # -----------------------------------------------------------------------
      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Python dependencies
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run integration tests (Python)
        if: inputs.language == 'python'
        run: |
          if [ -n "${{ inputs.test_command }}" ]; then
            ${{ inputs.test_command }}
          else
            python -m pytest tests/integration/ -v --timeout=60
          fi

      # -----------------------------------------------------------------------
      # Go — Integration tests
      # -----------------------------------------------------------------------
      - name: Setup Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      - name: Run integration tests (Go)
        if: inputs.language == 'go'
        run: |
          if [ -n "${{ inputs.test_command }}" ]; then
            ${{ inputs.test_command }}
          else
            go test ./... \
              -v \
              -run "Integration" \
              -timeout 120s \
              -count=1
          fi

      # -----------------------------------------------------------------------
      # Cleanup
      # -----------------------------------------------------------------------
      - name: Stop Kafka
        if: always() && inputs.needs_kafka
        run: |
          docker stop kafka zookeeper 2>/dev/null || true
          docker rm kafka zookeeper 2>/dev/null || true
        working-directory: /